# Development profile: no domain yet, plain ws:// on port 8080
# (the only alternate port opened in the cloud security group).
# Production must use the TLS profile (nginx-voice-relay-prod.conf) instead.
# Install to /etc/nginx/sites-available/reading-companion-relay.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 2m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;

    # The device's only data path.
    location /api/v1/voice/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # SSE debug endpoint (admin token protected; disabled when no admin token).
    location /api/v1/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
    }

    # Text-to-image cards: generation call + the BMP asset itself.
    location /api/v1/image {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # AI-native reading: book upload/index metadata. 64 MiB file cap plus
    # multipart overhead; parsing runs in the relay's background worker.
    location /api/v1/books {
        client_max_body_size 70m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Citation-grounded reading Q&A (one upstream model call per request).
    location /api/v1/reader/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Offline annotation/AI-result sync (small JSON batches).
    location /api/v1/sync/ {
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # Vocabulary learning: word book + review queue sync (device data path).
    location /api/v1/learning/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # Pomodoro focus timer: session upload + stats (device data path).
    location /api/v1/pomodoro/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # Pigeon device-to-device messages (heartbeat/presence + inbox/send/ack).
    location /api/v1/pigeon/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # Read-only market snapshots (board/chart/lookup via relay upstreams).
    location /api/v1/markets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # Calendar page weather (IP-located forecast; one small GET per six hours
    # per city, so no upgrade headers and no long read timeout).
    location /api/v1/weather {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # Text-to-speech: one long-lived socket carrying text up and 16 kHz PCM
    # down. Buffering off is what keeps the audio flowing instead of arriving
    # in bursts at the end of a page.
    location /api/v1/tts {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /api/v1/device/config {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # /metrics stays internal (127.0.0.1:8000 only).
    location / {
        return 404;
    }
}
